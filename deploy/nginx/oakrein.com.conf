# ---------- oakrein.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name oakrein.com www.oakrein.com;
    client_max_body_size 55m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://oakrein.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oakrein.com;
    client_max_body_size 55m;

    ssl_certificate /etc/letsencrypt/live/oakrein.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oakrein.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://oakrein.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oakrein.com;
    client_max_body_size 55m;

    ssl_certificate /etc/letsencrypt/live/oakrein.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oakrein.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oakrein_api http://oakrein-backend-1:5000;
        proxy_pass $oakrein_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oakrein_fe http://oakrein-frontend-1:3020;
        proxy_pass $oakrein_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $oakrein_fe http://oakrein-frontend-1:3020;
        proxy_pass $oakrein_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
