name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marhas
          POSTGRES_PASSWORD: marhas
          POSTGRES_DB: marhas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marhas -d marhas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      API_HOST: 127.0.0.1
      API_PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://marhas:marhas@127.0.0.1:5432/marhas
      DATABASE_MIGRATE_URL: postgresql://marhas:marhas@127.0.0.1:5432/marhas
      PG_POOL_MAX: 10
      PG_IDLE_TIMEOUT_MS: 10000
      PG_CONNECTION_TIMEOUT_MS: 10000
      PG_STATEMENT_TIMEOUT_MS: 15000
      HMAC_SIGNING_SECRET: ci-hmac-signing-secret-value-32chars-min
      SESSION_SECRET: ci-session-secret-value-must-be-32-chars
      SESSION_TTL_SECONDS: 604800
      NONCE_TTL_SECONDS: 600
      HMAC_TIMESTAMP_WINDOW_SECONDS: 300
      RATE_LIMIT_CAPACITY: 100
      RATE_LIMIT_REFILL_PER_SECOND: 0.11
      CORS_ORIGIN: http://localhost:3000
      SUPPORT_EMAIL: support@example.com
      EMAIL_FROM: MARHAS <noreply@example.com>
      UPLOAD_MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: src/server/uploads
      STORAGE_PROVIDER: local
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMeAdmin123
      SEED_ADMIN_NAME: MARHAS Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps:circular
      - run: npm test
      - run: npm run audit
      - run: npm run build
